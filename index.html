<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wolves 2026 — Batting Stats</title>
  <style>
    :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --ink:#e2e8f0; --muted:#94a3b8; --accent:#38bdf8; --good:#34d399; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, system-ui, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--ink); padding: 16px; max-width: 1000px; margin: 0 auto; }
    h1 { font-size: 1.6rem; margin-bottom: 2px; }
    .sub { color: var(--muted); margin-bottom: 16px; font-size: .9rem; }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 8px; overflow-x: auto; margin-bottom: 16px; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; font-variant-numeric: tabular-nums; }
    th, td { padding: 6px 8px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
    th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--card); }
    th { cursor: pointer; user-select: none; color: var(--muted); font-weight: 600; }
    th.sorted { color: var(--accent); }
    th.derived, td.derived { color: var(--good); }
    th.sep, td.sep { border-left: 2px solid var(--line); }
    tbody tr:hover { background: rgba(56,189,248,.08); }
    tfoot td { font-weight: 700; border-top: 2px solid var(--line); }
    .muted { color: var(--muted); }
    .err { color: #f87171; }
    .controls { display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin:4px 0 8px; font-size:13px; }
    .controls .group { display:flex; gap:4px; align-items:center; }
    .controls button { background:var(--card); color:var(--muted); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; font-size:12px; }
    .controls button.on { color:var(--bg); background:var(--accent); border-color:var(--accent); font-weight:600; }
    .chart svg { width:100%; height:auto; display:block; }
    .chart .axis { stroke:var(--line); stroke-width:1; }
    .chart text { fill:var(--muted); font-size:11px; }
    .chart .pt { cursor:pointer; }
  </style>
</head>
<body>
  <div id="app"><p class="muted">Loading…</p></div>
  <script src="wolves_stats.js"></script>
  <script>
  const WS = window.WolvesStats;
  // Columns: key = field or derived name; d = derived flag; sep = left separator
  const COLS = [
    { key: 'g',   label: 'G',   sep: false },
    { key: 'ab',  label: 'AB' }, { key: 'h', label: 'H' },
    { key: '_2b', label: '2B' }, { key: '_3b', label: '3B' }, { key: 'hr', label: 'HR' },
    { key: 'r',   label: 'R' },  { key: 'rbi', label: 'RBI' },
    { key: 'bb',  label: 'BB' }, { key: 'k', label: 'K' }, { key: 'hbp', label: 'HBP' },
    { key: 'avg', label: 'AVG', d: true, sep: true }, { key: 'obp', label: 'OBP', d: true },
    { key: 'slg', label: 'SLG', d: true }, { key: 'ops', label: 'OPS', d: true }, { key: 'iso', label: 'ISO', d: true },
  ];
  let DATA = null;
  let sort = { col: 'ops', dir: 'desc' };

  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;' }[c])); }

  // Build a flat row {name, g, ...fields, ...derived} for one player.
  function playerRow(name) {
    const { line, g } = WS.seasonLine(DATA, name);
    const d = WS.compute(line);
    return Object.assign({ name, g }, line, d);
  }
  function teamRow() {
    const line = WS.teamLine(DATA);
    const d = WS.compute(line);
    return Object.assign({ name: 'TEAM', g: '' }, line, d);
  }
  function cellText(row, col) {
    const v = row[col.key];
    if (col.d) return WS.fmt(v);
    return v === '' ? '' : String(v);
  }

  function renderHome() {
    const rows = WS.roster(DATA).map(playerRow);
    rows.sort((a, b) => {
      if (sort.col === 'name') return sort.dir === 'asc' ? a.name.localeCompare(b.name) : b.name.localeCompare(a.name);
      const av = a[sort.col] || 0, bv = b[sort.col] || 0;
      return sort.dir === 'asc' ? av - bv : bv - av;
    });
    const th = c => `<th class="${c.d ? 'derived ' : ''}${c.sep ? 'sep ' : ''}${sort.col === c.key ? 'sorted' : ''}" data-col="${c.key}">${c.label}</th>`;
    const nameTh = `<th data-col="name" class="${sort.col === 'name' ? 'sorted' : ''}">Player</th>`;
    const td = (row, c) => `<td class="${c.d ? 'derived ' : ''}${c.sep ? 'sep' : ''}">${cellText(row, c)}</td>`;
    const bodyRow = r => `<tr><td><a href="#player=${encodeURIComponent(r.name)}">${esc(r.name)}</a></td>${COLS.map(c => td(r, c)).join('')}</tr>`;
    const tr = teamRow();
    document.getElementById('app').innerHTML = `
      <h1>Wolves 2026 — Batting Stats</h1>
      <p class="sub">Season totals across ${WS.orderedGames(DATA).length} games. Tap a column to sort, or a player for their page.</p>
      <div class="card"><table>
        <thead><tr>${nameTh}${COLS.map(th).join('')}</tr></thead>
        <tbody>${rows.map(bodyRow).join('')}</tbody>
        <tfoot><tr><td>${esc(tr.name)}</td>${COLS.map(c => td(tr, c)).join('')}</tr></tfoot>
      </table></div>
      <p class="sub">Batting only — this site does not track game scores or W/L record.</p>`;
    document.querySelectorAll('th[data-col]').forEach(el => el.addEventListener('click', () => {
      const col = el.dataset.col;
      if (sort.col === col) sort.dir = sort.dir === 'asc' ? 'desc' : 'asc';
      else sort = { col, dir: col === 'name' ? 'asc' : 'desc' };
      renderHome();
    }));
  }

  function parseHash() {
    const m = location.hash.match(/^#player=(.+)$/);
    return m ? decodeURIComponent(m[1]) : null;
  }
  function router() {
    const name = parseHash();
    if (name && WS.roster(DATA).includes(name)) renderPlayer(name);
    else renderHome();
    window.scrollTo(0, 0);
  }

  function statRowHtml(line, derived) {
    const cells = COLS.map(c => {
      if (c.key === 'g') return '';
      const isD = !!c.d;
      const v = isD ? WS.fmt(derived[c.key]) : (line[c.key] != null ? line[c.key] : 0);
      return `<td class="${isD ? 'derived ' : ''}${c.sep ? 'sep' : ''}">${v}</td>`;
    }).join('');
    const head = COLS.filter(c => c.key !== 'g').map(c => `<th class="${c.d ? 'derived ' : ''}${c.sep ? 'sep' : ''}">${c.label}</th>`).join('');
    return `<table><thead><tr>${head}</tr></thead><tbody><tr>${cells}</tr></tbody></table>`;
  }

  function renderPlayer(name) {
    const { line, g } = WS.seasonLine(DATA, name);
    const derived = WS.compute(line);
    const log = WS.gameLog(DATA, name);
    const logHead = COLS.filter(c => c.key !== 'g').map(c => `<th class="${c.d ? 'derived ' : ''}${c.sep ? 'sep' : ''}">${c.label}</th>`).join('');
    const logRows = log.map(r => {
      if (r.scratched) {
        return `<tr><td>${esc(r.label || r.date || 'Game')}</td><td class="muted" colspan="${COLS.length - 1}">Did not play</td></tr>`;
      }
      const cells = COLS.filter(c => c.key !== 'g').map(c => {
        const v = c.d ? WS.fmt(r.derived[c.key]) : r.line[c.key];
        return `<td class="${c.d ? 'derived ' : ''}${c.sep ? 'sep' : ''}">${v}</td>`;
      }).join('');
      return `<tr><td>${esc(r.label || r.date || 'Game')}</td>${cells}</tr>`;
    }).join('');
    document.getElementById('app').innerHTML = `
      <p><a href="#">&larr; Back to team</a></p>
      <h1>${esc(name)}</h1>
      <p class="sub">${g} game${g === 1 ? '' : 's'} played · Wolves 2026</p>
      <div class="card">${statRowHtml(line, derived)}</div>
      <div id="chart"></div>
      <h2 style="font-size:1.1rem;margin:8px 0">Game log</h2>
      <div class="card"><table><thead><tr><th>Game</th>${logHead}</tr></thead><tbody>${logRows}</tbody></table></div>`;
    renderChart(name); // implemented in Task 9
  }

  const chartState = { mode: 'cumulative', metrics: { avg: true, ops: true, obp: false, slg: false } };
  const METRIC_COLORS = { avg: '#38bdf8', ops: '#f472b6', obp: '#34d399', slg: '#fbbf24' };

  function renderChart(name) {
    const host = document.getElementById('chart');
    if (!host) return;
    const metricBtns = ['avg', 'obp', 'slg', 'ops'].map(m =>
      `<button class="${chartState.metrics[m] ? 'on' : ''}" data-metric="${m}" style="${chartState.metrics[m] ? 'background:' + METRIC_COLORS[m] + ';border-color:' + METRIC_COLORS[m] : ''}">${m.toUpperCase()}</button>`).join('');
    const modeBtns = [['cumulative', 'Season to date'], ['pergame', 'This game']].map(([v, lbl]) =>
      `<button class="${chartState.mode === v ? 'on' : ''}" data-mode="${v}">${lbl}</button>`).join('');
    host.innerHTML = `
      <div class="controls">
        <div class="group">${modeBtns}</div>
        <div class="group">${metricBtns}</div>
      </div>
      <div class="card chart">${svgForPlayer(name)}</div>`;
    host.querySelectorAll('[data-mode]').forEach(b => b.addEventListener('click', () => { chartState.mode = b.dataset.mode; renderChart(name); }));
    host.querySelectorAll('[data-metric]').forEach(b => b.addEventListener('click', () => {
      const m = b.dataset.metric;
      const on = Object.keys(chartState.metrics).filter(k => chartState.metrics[k]);
      if (chartState.metrics[m] && on.length === 1) return; // keep at least one line
      chartState.metrics[m] = !chartState.metrics[m];
      renderChart(name);
    }));
  }

  function svgForPlayer(name) {
    const active = ['avg', 'obp', 'slg', 'ops'].filter(m => chartState.metrics[m]);
    const series = active.map(m => ({ m, pts: WS.trendSeries(DATA, name, m, chartState.mode) }));
    const n = series.length && series[0].pts.length;
    if (!n) return '<p class="muted" style="padding:8px">No games to chart yet.</p>';
    const W = 720, H = 280, padL = 38, padR = 12, padT = 12, padB = 46;
    let maxY = 0;
    series.forEach(s => s.pts.forEach(p => { if (p.value > maxY) maxY = p.value; }));
    maxY = Math.max(0.3, maxY * 1.1);
    const x = i => padL + (n === 1 ? (W - padL - padR) / 2 : i * (W - padL - padR) / (n - 1));
    const y = v => padT + (H - padT - padB) * (1 - v / maxY);
    const gridY = [0, 0.25, 0.5, 0.75, 1].map(f => f * maxY);
    const grid = gridY.map(v => `<line class="axis" x1="${padL}" y1="${y(v).toFixed(1)}" x2="${W - padR}" y2="${y(v).toFixed(1)}"/><text x="4" y="${(y(v) + 3).toFixed(1)}">${WS.fmt(v)}</text>`).join('');
    const xlabels = series[0].pts.map((p, i) => `<text x="${x(i).toFixed(1)}" y="${H - padB + 16}" text-anchor="middle">${i + 1}</text>`).join('');
    const lines = series.map(s => {
      const d = s.pts.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' ');
      const dots = s.pts.map((p, i) => `<circle class="pt" cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="3.5" fill="${METRIC_COLORS[s.m]}"><title>${esc(p.label || ('Game ' + (i + 1)))}${p.date ? ' (' + esc(p.date) + ')' : ''}\n${s.m.toUpperCase()} ${WS.fmt(p.value)}</title></circle>`).join('');
      return `<path d="${d}" fill="none" stroke="${METRIC_COLORS[s.m]}" stroke-width="2"/>${dots}`;
    }).join('');
    const legend = series.map((s, i) => `<text x="${padL + i * 70}" y="${H - 6}" fill="${METRIC_COLORS[s.m]}">${s.m.toUpperCase()}</text>`).join('');
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(name)} trend chart">${grid}${lines}${xlabels}${legend}</svg>`;
  }

  fetch('wolves2026.json')
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(d => { DATA = d; window.addEventListener('hashchange', router); router(); })
    .catch(e => { document.getElementById('app').innerHTML = '<p class="err">Could not load stats: ' + esc(e.message) + '</p>'; });
  </script>
</body>
</html>
